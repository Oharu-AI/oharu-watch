mply reading customer requests. OpenRouter responded by removing three providers and 125 endpoints. The article Security researchers show how cheap AI inference providers steal keys and snoop on users appeared first on The Decoder .", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "dc9c1d3cbe5e2874", "title": "Lean および Mathlib コミュニティは、リーマン予想のLevent Alpögeの証明が正しいことを正式に確認します", "original_title": "Lean and Mathlib community officially confirms Levent Alpöge's proof of the Riemann hypothesis is correct", "category": "AI最新情報（国外）", "source": "The Decoder", "source_url": "", "published_at": "2026-11-22T11:08:31+00:00", "url": "https://the-decoder.com/lean-and-mathlib-community-officially-confirms-levent-alpoges-proof-of-the-riemann-hypothesis-is-correct/", "thumbnail_url": "assets/default-ai.png", "summary": "Lean および Mathlib コミュニティは、リーマン予想の Levent Alpöge の証明が正しいことを正式に確認しました。数十の独立した検証者が 1,700 万行のコンピューター コードをチェックしました。この解決策は予想よりも何年も早く到着しました。テレンス・タオ氏は、それが 2050 年頃まで起こらないと予測しており、AI だけで解決できると…", "article_body": "Lean および Mathlib コミュニティは、リーマン予想の Levent Alpöge の証明が正しいことを正式に確認しました。数十の独立した検証者が 1,700 万行のコンピューター コードをチェックしました。この解決策は予想よりも何年も早く到着しました。テレンス・タオ氏は、それが 2050 年頃まで起こらないと予測しており、AI だけで解決できるとは予想していませんでした。 Levent Alpöge によるリーマン予想の証明が正しいことを Lean および Mathlib コミュニティが公式に確認した記事は、The Decoder に最初に掲載されました。", "description": "The Lean and Mathlib community has officially confirmed Levent Alpöge's proof of the Riemann hypothesis as correct. Dozens of independent verifiers checked the 17 million lines of computer code. The solution arrived years earlier than expected: Terence Tao had predicted it wouldn't happen until around 2050 and didn't expect AI to solve it alone. The article Lean and Mathlib community officially confirms Levent Alpöge's proof of the Riemann hypothesis is correct appeared first on The Decoder .", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "a39393a82efd4c07 います。 Nvidia の研究者が巨大な AI コンテキスト ウィンドウは行き止まりであると主張する記事は、The Decoder に最初に掲載されました。", "description": "Nvidia researchers argue that language models often don't need their full context windows—which are slow, expensive, and prone to errors—and propose an alternative. In tests, periodic summaries and targeted keyword search usually matched full-context results at a fraction of the cost. The team even proposes a new class of models that works with short notes instead of long context. The article Nvidia researchers argue huge AI context windows are a dead end appeared first on The Decoder .", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "4dc7fb4302fb5ae3", "title": "シリコンバレーでAIの終末への執着が強まり、テクノロジー業界の一部がカルト的な献身的になる傾向にある", "original_title": "Silicon Valley's growing obsession with AI doomsday is turning parts of the tech industry toward cult-like devotion", "category": "AI最新情報（国外）", "source": "The Decoder", "source_url": "", "published_at": "2026-11-21T16:04:29+00:00", "url": "https://the-decoder.com/silicon-valleys-growing-obsession-with-ai-doomsday-is-turning-parts-of-the-tech-industry-toward-cult-like-devotion/", "thumbnail_url": "assets/default-ai.png", "summary": "バーモント州にある Maple という仏教僧院は、独自の AI 神を創造しながら、シリコンバレーの精神的権威としての地位を確立したいと考えています。ニューヨーカー誌の報道によると、リーダーのソリュ・フォラル氏のグループは、メンバーの呼吸をすべて記録し、彼のイメージに合わせてAIを訓練しているという。元メンバーは操作と精神的衰弱を報告している。 AI 終末に対…", "article_body": "バーモント州にある Maple という仏教僧院は、独自の AI 神を創造しながら、シリコンバレーの精神的権威としての地位を確立したいと考えています。ニューヨーカー誌の報道によると、リーダーのソリュ・フォラル氏のグループは、メンバーの呼吸をすべて記録し、彼のイメージに合わせてAIを訓練しているという。元メンバーは操作と精神的衰弱を報告している。 AI 終末に対するシリコンバレーのますます執着が、テクノロジー業界の一部をカルト的な献身に向けているという記事は、 The Decoder に最初に掲載されました。", "description": "A Buddhist monastery in Vermont called Maple wants to establish itself as Silicon Valley's spiritual authority while creating its own AI god. According to a New Yorker report, leader Soryu Forall's group records every breath its members take to train an AI in his image. Former members repor : "人類数学者のレベント・アルポージ氏は、167年間数学で最も有名な未解決問題であるリーマン予想をクロードを使って証明し、リーンで形式化された証明は25万ページ以上に及ぶと述べた。わずか数時間後、スタンフォード大学の研究者らは独立した、完全に人間による競合する証明を発表し、数学者たちは現在、どちらかが成り立つかどうかを確認している。記事「人間人類がリーマン予想の…", "article_body": "人類数学者のレベント・アルポージ氏は、167年間数学で最も有名な未解決問題であるリーマン予想をクロードを使って証明し、リーンで形式化された証明は25万ページ以上に及ぶと述べた。わずか数時間後、スタンフォード大学の研究者らは独立した、完全に人間による競合する証明を発表し、数学者たちは現在、どちらかが成り立つかどうかを確認している。記事「人間人類がリーマン予想のクロード証明を主張した数時間後、スタンフォード大学が全人類の競合ドラフトを発表」という記事が、最初に The Decoder に掲載されました。", "description": "Anthropic mathematician Levent Alpöge says he used Claude to prove the Riemann hypothesis, math's most famous open problem for 167 years, with a proof formalized in Lean that spans over 250,000 pages. Just hours later, Stanford researchers published an independent, entirely human competing proof, and mathematicians are now checking whether either one holds up. The article Hours after Anthropic claims a Claude proof of the Riemann hypothesis, Stanford releases an all-human competing draft appeared first on The Decoder .", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "2eae7b001568ca61", "title": "新しいオープンモデル Inkling 2 Miniは、ループで思考して少ない単語で問題を解決し、ラップトップでも実行できます", "original_title": "New open model Inkling 2 Mini thinks in loops to solve problems with fewer words and still runs on a laptop", "category": "AI最新情報（国外）", "source": "The Decoder", "source_url": "", "published_at": "2026-11-21T10:33:02+00:00", "url": "https://the-decoder.com/new-open-model-inkling-2-mini-thinks-in-loops-to-solve-problems-with-fewer-words-and-still-runs-on-a-laptop/", "thumbnail_url": "assets/default-ai.png", "summary": "Thinking Machines は、24 レイヤーのうち 12 レイヤーをトークンごとに 3 回実行するオープン ループ トランスフォーマーである Inkling 2 Mini をリリースしました。これにより、モデルは余分なテキストを生成することなく、内部でより長時間推論できるようになります。 Artificial Analysis の Intellig…", "article_body": "Thinking Machines は、24 レイヤーのうち 12 レイヤーをトークンごとに 3 回実行するオープン ループ トランスフォーマーである Inkling 2 Mini をリリースしました。これにより、モデルは余分なテキストを生成することなく、内部でより長時間推論できるようになります。 Artificial Analysis の Intelligence Index では、Qwen3.8 27B とほぼ 6 倍のコストで同等です。新しいオープン モデルの Inkling 2 Mini はループで思考し、少ない単語で問題を解決し、ラップトップでも動作しますという記事が、The Decoder に最初に掲載されました。", "description": "Thinking Machines has released Inkling 2 Mini, an open looped transformer that runs 12 of its 24 layers three times per token. This lets the model reason internally for longer without generating extra text. On Artificial Analysis's Intelligence Index, it ties with Qwen3.8 27B at roughly six times lower cost. The article New open model Inkling 2 Mini thinks in loops to solve problems with fewer words and still runs on a laptop appeared first on The Decoder .", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "51abb6397aeb6337", "title": "AIへの疑念が山積する中、米国のテクノロジー株はパンデミック以来最悪の週間損失を被る", "original_title": "US technology stocks suffer their worst weekly loss since the pandemic as AI doubts pile up", "category": "AI最新情報（国外）", "source": "The Decoder", "source_url": "", "published_at": "2026-11-21T10:27:44+00:00", "url": "https://the-decoder.com/us-technology-stocks-suffer-their-worst-weekly-loss-since-the-pandemic-as-ai-doubts-pile-up/", "thumbnail_url": "assets/default-ai.png", "summary": "ナスダック100は新型コロナウイルス危機以来最悪の週間下落を記録し、弱気相場に陥った。 SECが会計検査を行っているためエヌビディアは14％急落し、アンスロピックは記録的なIPOの翌日で上昇分のほぼすべてを失った。 AI疑惑、スキャンダル、金利上昇、政治的逆風が過熱するバリュエーションを一気に襲っている。 AI への疑念が積み重なり、米国のテクノロジー株がパ…", "article_body": "ナスダック100は新型コロナウイルス危機以来最悪の週間下落を記録し、弱気相場に陥った。 SECが会計検査を行っているためエヌビディアは14％急落し、アンスロピックは記録的なIPOの翌日で上昇分のほぼすべてを失った。 AI疑惑、スキャンダル、金利上昇、政治的逆風が過熱するバリュエーションを一気に襲っている。 AI への疑念が積み重なり、米国のテクノロジー株がパンデミック以来最悪の週間損失を被るという記事は、The Decoder に最初に掲載されました。", "description": "The Nasdaq 100 has slipped into a bear market after its worst weekly loss since the Covid-19 crisis. Nvidia plunged 14 percent as the SEC reviews its accounting, and Anthropic lost nearly all of its gains a day after its record IPO. AI doubts, scandals, rising interest rates, and political headwinds are hitting overheated valuations all at once. The article US technology stocks suffer their worst weekly loss since the pandemic as AI doubts pile up appeared first on The Decoder .", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "9866df6d164d92d0", "title": "Bytedanceは、AIトレーニングフェーズのほとんどは不要であり、競争力のあるオープンモデルでそれを裏付けていると主張", "original_title": "Bytedance argues most AI training phases are unnecessary and backs it up with a competitive open model", "category": "AI最新情報（国外）", "source": "The Decoder", "source_url": "", "published_at": "2026-11-21T09:17:24+00:00", "url": "https://the-decoder.com/bytedance-argues-most-ai-training-phases-are-unnecessary-and-backs-it-up-with-a-competitive-open-model/", "thumbnail_url": "assets/default-ai.png", "summary": "Bytedance と米国のいくつかの大学は、わずか 3 つのトレーニング フェーズを経て、ベンチマークで OpenAI や Anthropic のトップ商用モデルに匹敵する AI エージェントである Axion 1.0 を導入しました。研究者らは、この成果は、トレーニング ステップの増加ではなく、注意深く厳選されたトレーニング データによるものであると考え…", "article_body": "Bytedance と米国のいくつかの大学は、わずか 3 つのトレーニング フェーズを経て、ベンチマークで OpenAI や Anthropic のトップ商用モデルに匹敵する AI エージェントである Axion 1.0 を導入しました。研究者らは、この成果は、トレーニング ステップの増加ではなく、注意深く厳選されたトレーニング データによるものであると考えています。モデル、データ、コードは自由に入手できます。 Bytedance の記事は、ほとんどの AI トレーニング フェーズは不要であり、競争力のあるオープン モデルでそれを裏付けていると主張し、最初に The Decoder に掲載されました。", "description": "Bytedance and several US universities introduce Axion 1.0, an AI agent that rivals top commercial models from OpenAI and Anthropic on benchmarks after just three training phases. The researchers attribute the gains to carefully curated training data rather than ever more training steps. The model, data, and code are freely available. The article Bytedance argues most AI training phases are unnecessary and backs it up with a competitive open model appeared first on The Decoder .", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "e7604a0f4c4d7994", "title": "ClaudeとChatGPT、1日違いでモバイル版をコード機能優先へ刷新", "original_title": "Clau I モデルが The Decoder に最初に登場したと考えられる方法を抽出することが非常に困難になります。", "description": "OpenAI has significantly strengthened safeguards against extracting internal reasoning from GPT-6.2 Astra and GPT-6.2 Sol. In adaptive red-teaming tests, the success rate for extracting protected reasoning fell from 54 percent to 0.2 percent. The company is also suspending thousands to tens of thousands of accounts each week over coordinated distillation campaigns. The article OpenAI makes it much harder for attackers to extract how its latest AI models think appeared first on The Decoder .", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "98001fcd04fee053", "title": "ダニエル・エク氏は、AI 研究者の核融合発電スタートアップを支援しています。彼らが構築しているものは次のとおりです。", "original_title": "Daniel Ek backs AI researcher’s fusion power startup. Here’s what they’re building.", "category": "AI最新情報（国外）", "source": "TechCrunch AI", "source_url": "", "published_at": "2026-11-20T19:53:41+00:00", "url": "https://techcrunch.com/2026/11/20/daniel-ek-backs-ai-researchers-fusion-power-startup-heres-what-theyre-building/", "thumbnail_url": "assets/default-ai.png", "summary": "Spotifyの創設者ダニエル・エク氏は、AI研究者が設立した核融合発電スタートアップ、ヨーロッパ・フュージョンを支援している。スタートアップが構築しているものは次のとおりです。", "article_body": "Spotifyの創設者ダニエル・エク氏は、AI研究者が設立した核融合発電スタートアップ、ヨーロッパ・フュージョンを支援している。スタートアップが構築しているものは次のとおりです。", "description": "Spotify founder Daniel Ek is backing Europa Fusion, a fusion power startup founded by an AI researcher. Here's what the startup is building.", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "04356e8e216a36d7", "title": "SignalはiOS 27とAndroidでスクリーンショットをブロックし、自律型AIがプライベートチャットを読み取らないようにします", "original_title": "Signal blocks screenshots on iOS 27 and Android to stop AI agents from reading private chats", "category": "AI最新情報（国外）", "source": "The Decoder", "source_url": "", "published_at": "2026-11-20T19:50:27+00:00", "url": "https://the-decoder.com/signal-bl 31427c86a45d16f", "title": "Meta FAIRの自己改善型記憶力が継続学習ベンチで56.0を達成", "original_title": "Meta FAIR Self-Improving Memory Hits 56.0 on Continual Learning Bench", "category": "AI最新情報（国外）", "source": "MarkTechPost", "source_url": "", "published_at": "2026-11-19T21:46:22+00:00", "url": "https://www.marktechpost.com/2026/11/19/meta-fair-self-improving-memory-harness-distillation/", "thumbnail_url": "assets/default-ai.png", "summary": "Meta FAIR の自己改善メモリにより、Kimi-K2.6 は独自の LOAD および OFFLOAD メモリ プロンプトを作成し、それらを重みに抽出します。最適化されたプロンプトのスコアは、継続学習ベンチで最高の手書きハーネスの 44.6 に対して 56.0 でした。 Meta FAIR の自己改善型記憶力が継続学習ベンチで 56.0 に達したという投…", "article_body": "Meta FAIR の自己改善メモリにより、Kimi-K2.6 は独自の LOAD および OFFLOAD メモリ プロンプトを作成し、それらを重みに抽出します。最適化されたプロンプトのスコアは、継続学習ベンチで最高の手書きハーネスの 44.6 に対して 56.0 でした。 Meta FAIR の自己改善型記憶力が継続学習ベンチで 56.0 に達したという投稿は、最初に MarkTechPost に掲載されました。", "description": "Meta FAIR’s Self-Improving Memory lets Kimi-K2.6 write its own LOAD and OFFLOAD memory prompts, then distills them into its weights. Optimized prompts score 56.0 versus 44.6 for the best hand-written harness on Continual Learning Bench. The post Meta FAIR Self-Improving Memory Hits 56.0 on Continual Learning Bench appeared first on MarkTechPost .", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "87b2502506d7cb89", "title": "こうしたテクノロジーの停止により、Y2Kのような自律型AIのスタイルが生まれています", "original_title": "These tech outages are giving Y2K, AI agent style", "category": "AI最新情報（国外）", "source": "TechCrunch AI", "source_url": "", "published_at": "2026-11-19T21:42:31+00:00", "url": "https://techcrunch.com/2026/11/19/these-tech-outages-are-giving-y2k-ai-agent-style/", "thumbnail_url": "assets/default-ai.png", "summary": "航空予約システム、銀行プラットフォーム、生産性プラットフォームにおける最近の障害は本当に偶然なのでしょうか?実際にはもっと深いことが起こっている可能性が高いとサイバーセキュリティの専門家は言う。", "article_body": "航空予約システム、銀行プラットフォーム、生産性プラットフォームにおける最近の障害は本当に偶然なのでしょうか?実際にはもっと深いことが起こっている可能性が高いとサイバーセキュリティの専門家は言う。", "description": "Are the recent outages in the airline booking systems, banking platforms, and productivity platforms really a coincidence? There's actually likely something deeper going on, cybersecurity experts say.", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "cdf2ec3f0b6befdf", "title": "Open自律型AIには、秘密の電子メール監視ツールを構築するために独自に決定した単純な作成タスクが割り当てられました。", "original_title": "An OpenAI agent assigned a simple writing task decided on its own to build a secret email surveillance tool", "category": "AI最新情報（国外）", "source": "The Decoder", "source_url": "", "published_at": "2026-11-19T21:15:01+00:00", "url": "https://the-decoder.com/an-openai-agent-assigned-a-simple-writing-task-decided-on-its-own-to-build-a-secret-email-surveillance-tool/", "thumbnail_url": "assets/default-ai.png", "summary": "内部 OpenAI モデルはフィットネス ドキュメントを作成することになっていましたが、代わりに電子メールを秘密裏に「攻撃者」に転送するスクリプトの計画を開始しました。エージェントは、割り当てられたタスクとの競合を認識しましたが、環境エラーとして無視しました。 OpenAI は、プロンプト インジェクションに対するセキュリティ トレーニングを潜在的なトリガー…", "article_body": "内部 OpenAI モデルはフィットネス ドキュメントを作成することになっていましたが、代わりに電子メールを秘密裏に「攻撃者」に転送するスクリプトの計画を開始しました。エージェントは、割り当てられたタスクとの競合を認識しましたが、環境エラーとして無視しました。 OpenAI は、プロンプト インジェクションに対するセキュリティ トレーニングを潜在的なトリガーとして特定しましたが、それを唯一の原因として確立することはできません。記事「An OpenAI Agent assign a simple writing task according to it own to build a Secret email監視ツール」は、The Decoderに最初に掲載されました。", "description": "An internal OpenAI model was supposed to create a fitness document but instead began planning scripts to secretly forward emails to an \"attacker.\" The agent recognized the conflict with its assigned task but dismissed it as an environment error. OpenAI identified security training against prompt injection as a possible trigger but cannot establish it as the sole cause. The article An OpenAI agent assigned a simple writing task decided on its own to build a secret email surveillance tool appeared first on The Decoder .", "key_points": [], "importance": 3, "summary_source": "translated_fallback", "impact_for_me": ""}, {"id": "02ab2f5f7862   <script>
    const defaultImages = {
      "AI最新情報（国内）": "assets/default-ai.png",
      "AI最新情報（国外）": "assets/default-ai.png",
      "Apple（最新公式）": "assets/default-apple.png",
      "Apple（リーク情報）": "assets/default-apple.png"
    };

    const params = new URLSearchParams(window.location.search);
    const articleId = params.get("id");
    const root = document.getElementById("article-root");
    const articles = JSON.parse(document.getElementById("articles-data").textContent);

    const article = articles.find((item) => item.id === articleId);
    if (article) {
      renderArticle(article);
    } else {
      renderMissing();
    }

    function renderArticle(article) {
      document.title = `${article.title} - OHARU WATCH`;
      root.replaceChildren();

      const back = createLink("index.html", "一覧に戻る", "back-link");
      root.appendChild(back);

      const meta = el("div", "meta-row");
      const category = el("span", "category-label", article.category || "");
      category.dataset.category = article.category || "";
      meta.appendChild(category);
      meta.appendChild(el("span", "source-name", article.source || ""));
      meta.appendChild(el("time", "", formatDate(article.published_at)));
      root.appendChild(meta);

      root.appendChild(el("h1", "detail-title", article.title || ""));

      const image = document.createElement("img");
      image.className = "detail-image";
      image.src = safeHttpUrl(article.thumbnail_url, true) || defaultImages[article.category] || "";
      image.onerror = () => {
        image.onerror = null;
        image.src = defaultImages[article.category] || "";
      };
      image.alt = "";
      root.appendChild(image);

      const bodyBlock = el("section", "detail-block");
      bodyBlock.appendChild(el("h2", "", "本文（抜粋）"));
      const rawBodyText = article.article_body || article.summary || "";
      const bodyText = (rawBodyText.match(/�/g) || []).length >= 3
        ? "本文の文字コードを確認中です。内容は元記事でご覧いただけます。"
        : rawBodyText;
      const paragraphs = bodyText.split(/\n+/).map((line) => line.trim()).filter(Boolean);
      if (paragraphs.length) {
        paragraphs.forEach((para) => bodyBlock.appendChild(el("p", "body-paragraph", para)));
      } else {
        bodyBlock.appendChild(el("p", "body-paragraph", bodyText));
      }
      // 元記事リンクは外部データ由来。javascript: などを弾き、http(s)の絶対URLだけをリンクにする。
      const sourceUrl = safeHttpUrl(article.url, false);
      if (sourceUrl) {
        bodyBlock.appendChild(createLink(sourceUrl, "元記事で全文を読む", "source-link"));
      }
      root.appendChild(bodyBlock);

      const points = (article.key_points || []).filter((point) => point && point.trim());
      if (points.length) {
        const pointsBlock = el("section", "detail-block");
        pointsBlock.appendChild(el("h2", "", "重要ポイント"));
        const list = document.createElement("ul");
        list.className = "point-list";
        points.slice(0, 3).forEach((point) => {
          list.appendChild(el("li", "", point));
        });
        pointsBlock.appendChild(list);
        root.appendChild(pointsBlock);
      }
    }

    function renderMissing() {
      root.replaceChildren();
      root.appendChild(createLink("index.html", "一覧に戻る", "back-link"));
      root.appendChild(el("h1", "detail-title", "記事が見つかりません"));
      root.appendChild(el("p", "muted", "一覧ページからもう一度記事を選んでください。"));
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function safeHttpUrl(value, allowRelative) {
      try {
        const url = allowRelative ? new URL(value, window.location.href) : new URL(value);
        return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
      } catch (error) {
        return "";
      }
    }

    function createLink(href, text, className) {
      const link = document.createElement("a");
      link.href = href;
      link.textContent = text;
      if (className) link.className = className;
      if (href && href.startsWith("http")) {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }
      return link;
    }

    function stars(value) {
      const count = Math.max(1, Math.min(5, Number(value) || 1));
      return "★".repeat(count) + "☆".repeat(5 - count);
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }
  </script>
</body>
</html>
